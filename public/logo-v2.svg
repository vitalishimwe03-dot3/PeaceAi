<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" role="img" aria-labelledby="peaceaiLogoTitle peaceaiLogoDesc">
  <title id="peaceaiLogoTitle">PeaceAI</title>
  <desc id="peaceaiLogoDesc">A shield formed by two interlocking strokes enclosing a calm node and orbit ring, paired with the PeaceAI wordmark.</desc>

  <defs>
    <linearGradient id="v2Surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1630"/>
      <stop offset="55%" stop-color="#150f24"/>
      <stop offset="100%" stop-color="#0e0913"/>
    </linearGradient>
    <linearGradient id="v2Edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="v2Warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a4c"/>
      <stop offset="100%" stop-color="#ffb07d"/>
    </linearGradient>
    <linearGradient id="v2Cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c5cf0"/>
    </linearGradient>
    <linearGradient id="v2WordAI" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb07d"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="v2Glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8a4c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <filter id="v2Soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- TILE -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#v2Surface)"/>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="url(#v2Glow)" opacity="0.9"/>
  <rect x="4.75" y="4.75" width="86.5" height="86.5" rx="21.25" fill="none" stroke="url(#v2Edge)" stroke-width="1.5"/>

  <!-- MARK: shield built from two interlocking arcs -->
  <g filter="url(#v2Soft)" opacity="0.55">
    <path d="M48 20 L72 29 V49 C72 63 61.5 72 48 77 C34.5 72 24 63 24 49 V29 Z" fill="url(#v2Warm)" opacity="0.35"/>
  </g>

  <!-- outer shield silhouette (cool) -->
  <path d="M48 18 L73 27.5 V49 C73 63.5 62 73.5 48 79 C34 73.5 23 63.5 23 49 V27.5 Z"
        fill="none" stroke="url(#v2Cool)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- inner shield silhouette (warm), offset to read as interlock -->
  <path d="M48 25 L67 32 V49.5 C67 60.5 58 68 48 72.5 C38 68 29 60.5 29 49.5 V32 Z"
        fill="none" stroke="url(#v2Warm)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- calm core: orbit ring + node -->
  <ellipse cx="48" cy="48.5" rx="13.5" ry="6.4" fill="none" stroke="#ffb07d" stroke-width="1.9"
           opacity="0.85" transform="rotate(-24 48 48.5)"/>
  <circle cx="48" cy="48.5" r="5.4" fill="url(#v2Cool)"/>
  <circle cx="48" cy="48.5" r="9.2" fill="none" stroke="#c4b5fd" stroke-width="1.1" opacity="0.45"/>

  <!-- spark node on the orbit -->
  <circle cx="58.6" cy="43.2" r="2.1" fill="#ff8a4c"/>

  <!-- WORDMARK -->
  <g font-family="'Space Grotesk', Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="-1">
    <text x="112" y="52" fill="#f8f5ff">Peace</text>
    <text x="222" y="52" fill="url(#v2WordAI)">AI</text>
  </g>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.4">
    <text x="113" y="70" fill="#9a8fb5">SECURE KNOWLEDGE AI</text>
  </g>
</svg>
