# Replace project_id with the Supabase project reference before linking.
project_id = "peaceai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "6GiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/reset-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[functions.ai-chat]
verify_jwt = true

[functions.process-dataset]
verify_jwt = true

[functions.create-payment]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.contact-message]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
